services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: fitroster
      POSTGRES_PASSWORD: fitroster
      POSTGRES_DB: fitroster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitroster_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fitroster
      SPRING_DATASOURCE_USERNAME: fitroster
      SPRING_DATASOURCE_PASSWORD: fitroster

volumes:
  fitroster_db_data:
